name: Publicar en YaDominios Cloud

# Compila el sitio (Next.js output: export → out/) y arma el paquete para
# YaDominios Cloud: worker (_worker.js) + wrangler.jsonc + assets/ (el sitio).
# Publica el resultado en la rama `yapanel-build`, a la que se conecta el panel.
# Cada push a main la reconstruye y republica sola.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yadominios-build
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio estático (genera out/)
        run: npm run build

      - name: Ensamblar worker + sitio para YaDominios
        run: |
          rm -rf publish
          mkdir -p publish
          cp -r out/. publish/
          cp worker/_worker.js publish/_worker.js

      - name: Publicar en la rama yapanel-build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: yapanel-build
          force_orphan: true
          commit_message: "build: worker + sitio para YaDominios Cloud"
